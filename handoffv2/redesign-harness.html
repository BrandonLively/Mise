<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mise — redesign screenshot harness</title>
  <link rel="stylesheet" href="../app/theme.css" />
  <style>
    html, body { margin: 0; padding: 0; background: #f0eee9; }
    body { font-family: 'Geist', system-ui, sans-serif; }
    #stage { display: inline-block; }
    .mp-pill { display: none !important; }
  </style>
</head>
<body>
  <div id="stage"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="../app/data/meal-prep.js"></script>
  <script type="text/babel" src="../app/shells.jsx"></script>
  <script type="text/babel" src="../app/screen-cook-v2.jsx"></script>

  <script type="text/babel" data-presets="env,react">
    function Frame({ children }) {
      return (
        <div className="mp-root" style={{ width: 1280, height: 800, background: 'var(--bg)', borderRadius: 18,
          overflow: 'hidden', display: 'flex', boxShadow: 'inset 0 0 0 1px var(--line-strong)' }}>
          <NavRail active="cook" onChange={() => {}} />
          {children}
        </div>
      );
    }
    function pick() {
      const key = (location.hash || '').slice(1) || 'cook';
      switch (key) {
        case 'cook': return <Frame><CookLanesTablet initialPhase="cook" /></Frame>;
        case 'mise': return <Frame><CookLanesTablet initialPhase="mise" /></Frame>;
        default: return <div>Unknown: {key}</div>;
      }
    }
    ReactDOM.createRoot(document.getElementById('stage')).render(pick());
    window.addEventListener('hashchange', () => location.reload());
  </script>
</body>
</html>
